name: VoiceReader
options:
  bundleIdPrefix: com.noorulain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: QAT93YWVSF
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels", "-weak_framework", "Translation"]

packages:
  SwiftOGG:
    url: https://github.com/element-hq/swift-ogg
    from: 0.0.4

targets:
  VoiceReader:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: ShareExtension
      - target: VoiceReaderWidget
      - package: SwiftOGG
    entitlements:
      path: App/VoiceReader.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.noorulain.voicereader
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Voice Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Voice Reader uses the microphone so you can record and transcribe speech live.
        NSSpeechRecognitionUsageDescription: Voice Reader uses speech recognition to turn your voice messages and audio files into text.
        NSFaceIDUsageDescription: Use Face ID to keep your transcriptions private.
        CFBundleURLTypes:
          - CFBundleURLName: com.noorulain.voicereader
            CFBundleURLSchemes: [voicereader]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.xiph.opus
            UTTypeDescription: Opus Audio
            UTTypeConformsTo: [public.audio, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [opus]
              public.mime-type: [audio/ogg, audio/opus]
          - UTTypeIdentifier: org.xiph.ogg-audio
            UTTypeDescription: Ogg Audio
            UTTypeConformsTo: [public.audio, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ogg, oga]
              public.mime-type: [audio/ogg]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, org.xiph.opus, org.xiph.ogg-audio, public.movie]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noorulain.voicereader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    dependencies:
      - package: SwiftOGG
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.noorulain.voicereader
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Voice Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSpeechRecognitionUsageDescription: Voice Reader uses speech recognition to turn your voice messages and audio files into text.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audiovisual-content" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.xiph.opus" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.xiph.ogg-audio" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data"
              ).@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noorulain.voicereader.share
        APPLICATION_EXTENSION_API_ONLY: NO

  VoiceReaderWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared/Models.swift
      - Shared/AppGroup.swift
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.noorulain.voicereader
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Voice Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noorulain.voicereader.widget
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  VoiceReader:
    build:
      targets:
        VoiceReader: all
    archive:
      config: Release
