name: Build & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['drop/**', '**.md']

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate app icon
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 ci/make_icon.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('project.yml') }}

      - name: Compile check (no signing)
        if: env.ASC_KEY_ID == ''
        run: |
          set -o pipefail
          xcodebuild build -project VoiceReader.xcodeproj -scheme VoiceReader \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Install API key
        if: env.ASC_KEY_ID != ''
        run: |
          KID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          IID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "ASC_KEY_ID=$KID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$IID" >> "$GITHUB_ENV"
          mkdir -p ~/private_keys
          BODY=$(printf '%s' "$ASC_KEY_P8" | grep -v -- '-----' | tr -d '[:space:]')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > ~/private_keys/AuthKey_$KID.p8
          echo "key id length: ${#KID}, issuer length: ${#IID}, body chars: ${#BODY}, p8 lines: $(wc -l < ~/private_keys/AuthKey_$KID.p8)" | tee keycheck.log

      - name: Archive
        if: env.ASC_KEY_ID != ''
        run: |
          set -o pipefail
          xcodebuild archive -project VoiceReader.xcodeproj -scheme VoiceReader \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/VoiceReader.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee build.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build.log

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != ''
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VoiceReader.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:|warning: .*(unavailable|deprecated)" build.log | sort -u | head -80 || true
          tail -40 export.log 2>/dev/null || true

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp *.log /tmp/ci/ 2>/dev/null || true
          grep -hE "error:|warning: .*(unavailable|deprecated)" *.log 2>/dev/null | sort -u | head -300 > /tmp/ci/errors.txt || true
          echo "run ${{ github.run_number }} ${{ job.status }} $(date -u)" > /tmp/ci/status.txt
          cd /tmp/ci && git init -q && git checkout -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "logs ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: '*.log'
          if-no-files-found: ignore
